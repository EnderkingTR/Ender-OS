name: Build & Publish Ender-OS OCI Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "05 04 * * *"
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - hyprland
          - hyprland-nvidia
          - plasma
          - plasma-nvidia

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    name: Determine build matrix
    runs-on: ubuntu-latest
    outputs:
      editions: ${{ steps.set-matrix.outputs.editions }}
    steps:
      - name: Select editions
        id: set-matrix
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.edition }}" != "all" ]]; then
            echo 'editions=["${{ inputs.edition }}"]' >> "${GITHUB_OUTPUT}"
          else
            echo 'editions=["hyprland","hyprland-nvidia","plasma","plasma-nvidia"]' >> "${GITHUB_OUTPUT}"
          fi

  build_push:
    name: Build (${{ matrix.edition }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJson(needs.plan.outputs.editions) }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize runner disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3

      - name: Prepare registry and image metadata
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME="ender-os-${{ matrix.edition }}"
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      - name: Build OCI image (${{ matrix.edition }})
        shell: bash
        run: |
          set -o pipefail
          if ! just build "${{ matrix.edition }}" latest 2>&1 | tee /tmp/build.log; then
            {
              echo "### Build failure tail (${{ matrix.edition }})"
              echo '```text'
              tail -n 60 /tmp/build.log || true
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

      - name: Rechunk OCI image for minimal delta updates
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: just ostree-rechunk "${{ matrix.edition }}" latest

      - name: Generate and apply release tags
        id: tags
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          set -euo pipefail
          alias_tags="$(just generate-tags latest)"
          echo "alias_tags=${alias_tags}" >> "${GITHUB_OUTPUT}"
          local_ref="localhost/${IMAGE_NAME}:latest"
          for tag in ${alias_tags}; do
            podman tag "${local_ref}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        id: push-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          ALIAS_TAGS: ${{ steps.tags.outputs.alias_tags }}
        run: |
          set -euo pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done
          digest="$(< /tmp/digestfile)"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: "v3.1.4"

      - name: Sign container image (when COSIGN_PRIVATE_KEY is set)
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "false"
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ -z "${COSIGN_PRIVATE_KEY:-}" ]]; then
            echo "COSIGN_PRIVATE_KEY secret is not configured; skipping Cosign image signing."
            exit 0
          fi
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
