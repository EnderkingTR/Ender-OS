name: Build Ender-OS ISO & VM Disks

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Target Ender-OS edition"
        required: true
        default: "hyprland"
        type: choice
        options:
          - hyprland
          - hyprland-nvidia
          - plasma
          - plasma-nvidia
      disk_type:
        description: "Artifact type (live-iso = Live Desktop + Graphical Installer, vmdk = VMware Disk, qcow2 = QEMU Disk)"
        required: true
        default: "live-iso"
        type: choice
        options:
          - live-iso
          - vmdk
          - qcow2
      tag:
        description: "Source OCI image tag in GHCR"
        required: true
        default: "latest"
        type: string
  release:
    types: [published]

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.edition || 'release' }}-${{ inputs.disk_type || 'live-iso' }}
  cancel-in-progress: true

jobs:
  plan:
    name: Determine disk build matrix
    runs-on: ubuntu-latest
    outputs:
      editions: ${{ steps.matrix.outputs.editions }}
      disk_type: ${{ steps.matrix.outputs.disk_type }}
      tag: ${{ steps.matrix.outputs.tag }}
    steps:
      - name: Compute matrix inputs
        id: matrix
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo 'editions=["hyprland","hyprland-nvidia","plasma","plasma-nvidia"]' >> "${GITHUB_OUTPUT}"
            echo "disk_type=live-iso" >> "${GITHUB_OUTPUT}"
            echo "tag=latest" >> "${GITHUB_OUTPUT}"
          else
            echo 'editions=["${{ inputs.edition }}"]' >> "${GITHUB_OUTPUT}"
            echo "disk_type=${{ inputs.disk_type }}" >> "${GITHUB_OUTPUT}"
            echo "tag=${{ inputs.tag }}" >> "${GITHUB_OUTPUT}"
          fi

  build-disk:
    name: Build ${{ needs.plan.outputs.disk_type }} (${{ matrix.edition }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJson(needs.plan.outputs.editions) }}

    permissions:
      contents: write
      packages: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize runner disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: true

      - name: Prepare image references
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME="ender-os-${{ matrix.edition }}"
          DISK_TYPE="${{ needs.plan.outputs.disk_type }}"
          TARGET_IMAGE="${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}:${{ needs.plan.outputs.tag }}"
          LIVE_BASE_IMAGE="${IMAGE_REGISTRY,,}/ender-os-plasma:${{ needs.plan.outputs.tag }}"
          mkdir -p "${PWD}/output/release"
          df -h
          {
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "IMAGE_NAME=${IMAGE_NAME,,}"
            echo "DISK_TYPE=${DISK_TYPE}"
            echo "TARGET_IMAGE=${TARGET_IMAGE}"
            echo "LIVE_BASE_IMAGE=${LIVE_BASE_IMAGE}"
          } >> "${GITHUB_ENV}"

      - name: Build Live Installer container image
        if: needs.plan.outputs.disk_type == 'live-iso'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers /var/tmp "${PWD}/output/release"
          sudo tee /etc/containers/storage.conf >/dev/null <<'EOF'
          [storage]
          driver = "overlay"
          runroot = "/run/containers/storage"
          graphroot = "/var/lib/containers/storage"
          EOF

          sudo env TMPDIR=/var/tmp podman build \
            --no-cache \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg "LIVE_BASE_IMAGE=${LIVE_BASE_IMAGE}" \
            --build-arg "INSTALL_IMAGE_PAYLOAD=${TARGET_IMAGE}" \
            --build-arg "TARGET_EDITION=${{ matrix.edition }}" \
            --tag "localhost/ender-os-live:latest" \
            disk_config/installer
          df -h

      - name: Build Live ISO with Titanoboa
        if: needs.plan.outputs.disk_type == 'live-iso'
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: localhost/ender-os-live:latest
          iso-dest: ${{ github.workspace }}/output/release/ender-os-${{ matrix.edition }}-x86_64.iso

      - name: Build VM disk image with bootc install to-disk
        if: needs.plan.outputs.disk_type == 'vmdk' || needs.plan.outputs.disk_type == 'qcow2'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-utils

          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers /var/tmp "${PWD}/output/release"
          sudo tee /etc/containers/storage.conf >/dev/null <<'EOF'
          [storage]
          driver = "overlay"
          runroot = "/run/containers/storage"
          graphroot = "/var/lib/containers/storage"
          EOF

          sudo podman build \
            --no-cache \
            --build-arg "TARGET_IMAGE=${TARGET_IMAGE}" \
            --tag "localhost/ender-os-vm:latest" \
            - <<'EOF'
          ARG TARGET_IMAGE
          FROM ${TARGET_IMAGE}
          RUN set -euo pipefail; \
              id -u ender >/dev/null 2>&1 || useradd -m -G wheel -s /bin/bash ender; \
              echo 'ender:ender' | chpasswd
          EOF

          OUT_DIR="${PWD}/output"
          sudo truncate -s 20G "${OUT_DIR}/disk.raw"
          sudo podman run \
            --rm \
            --privileged \
            --pid=host \
            --security-opt label=disable \
            --volume /var/lib/containers:/var/lib/containers \
            --volume /dev:/dev \
            --volume "${OUT_DIR}:/output" \
            localhost/ender-os-vm:latest \
            bootc install to-disk \
            --via-loopback \
            --filesystem btrfs \
            --generic-image \
            --wipe \
            --target-imgref "${TARGET_IMAGE}" \
            /output/disk.raw

          case "${DISK_TYPE}" in
            vmdk)
              sudo qemu-img convert -f raw -O vmdk -o subformat=monolithicSparse \
                "${OUT_DIR}/disk.raw" \
                "${OUT_DIR}/release/ender-os-${{ matrix.edition }}-x86_64.vmdk"
              ;;
            qcow2)
              sudo qemu-img convert -f raw -O qcow2 -c \
                "${OUT_DIR}/disk.raw" \
                "${OUT_DIR}/release/ender-os-${{ matrix.edition }}-x86_64.qcow2"
              ;;
          esac
          sudo chown -R "$(id -u):$(id -g)" "${OUT_DIR}/release"
          sudo rm -f "${OUT_DIR}/disk.raw"

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="${PWD}/output/release"
          ls -lh "${RELEASE_DIR}"
          (
            cd "${RELEASE_DIR}"
            sha256sum ender-os-* > "ender-os-${{ matrix.edition }}.SHA256SUMS"
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ender-os-${{ matrix.edition }}-${{ needs.plan.outputs.disk_type }}
          path: ${{ github.workspace }}/output/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Attach release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/output/release/*
