name: Build Ender-OS ISO & VM Disks

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Target Ender-OS edition"
        required: true
        default: "hyprland"
        type: choice
        options:
          - hyprland
          - hyprland-nvidia
          - plasma
          - plasma-nvidia
      disk_type:
        description: "Disk artifact type (anaconda-iso, vmdk, ova, qcow2)"
        required: true
        default: "anaconda-iso"
        type: choice
        options:
          - anaconda-iso
          - vmdk
          - ova
          - qcow2
      tag:
        description: "Source OCI image tag in GHCR"
        required: true
        default: "latest"
        type: string
  release:
    types: [published]

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  # Pinned to the last multi-arch release with bootc CustomDepsolverDistro intact before osbuild/images#2172 broke anaconda-iso
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:sha256-74ba1d6f7dfa83782623ddf3773e0f595db8c1a1a71dfa915be4d3918b27d963"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.edition || 'release' }}-${{ inputs.disk_type || 'iso' }}
  cancel-in-progress: true

jobs:
  plan:
    name: Determine disk build matrix
    runs-on: ubuntu-latest
    outputs:
      editions: ${{ steps.matrix.outputs.editions }}
      disk_type: ${{ steps.matrix.outputs.disk_type }}
      tag: ${{ steps.matrix.outputs.tag }}
    steps:
      - name: Compute matrix inputs
        id: matrix
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo 'editions=["hyprland","hyprland-nvidia","plasma","plasma-nvidia"]' >> "${GITHUB_OUTPUT}"
            echo "disk_type=anaconda-iso" >> "${GITHUB_OUTPUT}"
            echo "tag=latest" >> "${GITHUB_OUTPUT}"
          else
            echo 'editions=["${{ inputs.edition }}"]' >> "${GITHUB_OUTPUT}"
            echo "disk_type=${{ inputs.disk_type }}" >> "${GITHUB_OUTPUT}"
            echo "tag=${{ inputs.tag }}" >> "${GITHUB_OUTPUT}"
          fi

  build-disk:
    name: Build ${{ needs.plan.outputs.disk_type }} (${{ matrix.edition }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJson(needs.plan.outputs.editions) }}

    permissions:
      contents: write
      packages: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize runner disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: true

      - name: Prepare image references
        shell: bash
        run: |
          USER_UID="$(id -u)"
          USER_GID="$(id -g)"
          IMAGE_NAME="ender-os-${{ matrix.edition }}"
          DISK_TYPE="${{ needs.plan.outputs.disk_type }}"
          if [[ "${DISK_TYPE}" == "anaconda-iso" ]]; then
            CONFIG_FILE="${PWD}/disk_config/iso-${{ matrix.edition }}.toml"
          else
            CONFIG_FILE="${PWD}/disk_config/disk.toml"
          fi
          TARGET_IMAGE="${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}:${{ needs.plan.outputs.tag }}"
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          echo "TARGET_IMAGE=${TARGET_IMAGE}" >> "${GITHUB_ENV}"
          echo "CONFIG_FILE=${CONFIG_FILE}" >> "${GITHUB_ENV}"
          echo "USER_UID=${USER_UID}" >> "${GITHUB_ENV}"
          echo "USER_GID=${USER_GID}" >> "${GITHUB_ENV}"

      - name: Build disk image with bootc-image-builder
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers "${PWD}/output"
          sudo tee /etc/containers/storage.conf >/dev/null <<'EOF'
          [storage]
          driver = "overlay"
          runroot = "/run/containers/storage"
          graphroot = "/var/lib/containers/storage"
          EOF

          echo "Pulling target Ender-OS image (${TARGET_IMAGE}) and bootc-image-builder (${BIB_IMAGE})..."
          sudo podman pull "${TARGET_IMAGE}"
          sudo podman pull "${BIB_IMAGE}"

          echo "Normalizing container repo and GPG state for bootc-image-builder..."
          sudo podman build --no-cache --tag "${TARGET_IMAGE}" - <<EOF
          FROM ${TARGET_IMAGE}
          RUN set -euo pipefail; \
              if [[ ! -e /usr/bin/dnf && -x /usr/bin/dnf5 ]]; then ln -s dnf5 /usr/bin/dnf; fi; \
              sed -i 's/^ID=.*/ID=fedora/' /usr/lib/os-release; \
              for repo in /etc/yum.repos.d/_copr*.repo /etc/yum.repos.d/rpmfusion*.repo /etc/yum.repos.d/*multimedia*.repo /etc/yum.repos.d/*negativo17*.repo /etc/yum.repos.d/fedora-cisco-openh264.repo /etc/yum.repos.d/fedora-updates-archive.repo; do \
                  if [[ -f "\${repo}" ]]; then sed -i 's/enabled=1/enabled=0/g' "\${repo}"; fi; \
              done; \
              for repo in /etc/yum.repos.d/fedora.repo /etc/yum.repos.d/fedora-updates.repo; do \
                  if [[ -f "\${repo}" ]]; then sed -i '0,/enabled=0/{s/enabled=0/enabled=1/}' "\${repo}"; fi; \
              done; \
              for gpg_key in /etc/pki/rpm-gpg/*; do \
                  if [[ -L "\${gpg_key}" && -e "\${gpg_key}" ]]; then cp -f --remove-destination "\$(readlink -f "\${gpg_key}")" "\${gpg_key}"; fi; \
              done; \
              mkdir -p /usr/lib/bootc/install; \
              printf '[install.filesystem.root]\ntype = "btrfs"\n' > /usr/lib/bootc/install/00-ender-os.toml
          EOF

          sudo podman run \
            --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            --env IMAGE_BUILDER_EXPERIMENTAL="yamldir=/distrodefs" \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --volume "${PWD}/output:/output" \
            --volume "${CONFIG_FILE}:/config.toml:ro" \
            --volume "${PWD}/disk_config/distrodefs:/distrodefs:ro" \
            "${BIB_IMAGE}" \
            build \
            --output /output \
            --chown "${USER_UID}:${USER_GID}" \
            --rootfs btrfs \
            --use-librepo=True \
            --config /config.toml \
            --type "${{ needs.plan.outputs.disk_type }}" \
            "${TARGET_IMAGE}"

      - name: Rename artifact and generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${PWD}/output"
          ls -laR "${OUT_DIR}"
          mkdir -p "${OUT_DIR}/release"
          case "${{ needs.plan.outputs.disk_type }}" in
            anaconda-iso)
              mv "${OUT_DIR}/bootiso/install.iso" "${OUT_DIR}/release/ender-os-${{ matrix.edition }}-x86_64.iso"
              ;;
            vmdk)
              mv "${OUT_DIR}/vmdk/disk.vmdk" "${OUT_DIR}/release/ender-os-${{ matrix.edition }}-x86_64.vmdk"
              ;;
            ova)
              mv "${OUT_DIR}/archive/image.ova" "${OUT_DIR}/release/ender-os-${{ matrix.edition }}-x86_64.ova"
              ;;
            qcow2)
              mv "${OUT_DIR}/qcow2/disk.qcow2" "${OUT_DIR}/release/ender-os-${{ matrix.edition }}-x86_64.qcow2"
              ;;
          esac
          (
            cd "${OUT_DIR}/release"
            sha256sum ender-os-* > "ender-os-${{ matrix.edition }}.SHA256SUMS"
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ender-os-${{ matrix.edition }}-${{ needs.plan.outputs.disk_type }}
          path: ${{ github.workspace }}/output/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Attach release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/output/release/*
