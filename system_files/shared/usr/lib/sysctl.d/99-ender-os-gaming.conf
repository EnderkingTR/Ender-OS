# Ender-OS Gaming, Low-Latency & Developer Sysctl Tuning

# Increase memory map areas for Proton/Wine/AAA games (Star Citizen, Hogwarts Legacy, etc.)
vm.max_map_count = 2147483642

# Prefer keeping active working sets in RAM; use ZRAM only under real pressure
vm.swappiness = 10
vm.vfs_cache_pressure = 50

# Reduce split-lock stall penalties in Windows games translated via Proton/Wine
kernel.split_lock_mitigate = 0

# Low-latency network queue discipline & congestion control for online gaming and containers
net.core.default_qdisc = cake
net.ipv4.tcp_congestion_control = bbr

# Ample file watcher budget for modern IDEs, Rust/TypeScript/Python dev servers, and Vite/Webpack
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
