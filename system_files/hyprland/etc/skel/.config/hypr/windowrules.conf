# Ender-OS Window & Gaming Rules
windowrulev2 = suppressevent maximize, class:.*

# Floating utilities and dialogs
windowrulev2 = float, class:^(pavucontrol|org\.pulseaudio\.pavucontrol|blueman-manager|nm-connection-editor)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$

# Gaming apps & low-latency tearing rules
windowrulev2 = immediate, class:^(gamescope|steam_app_.*|.*\.exe)$
windowrulev2 = fullscreen, class:^(gamescope)$
windowrulev2 = idleinhibit fullscreen, class:.*
windowrulev2 = float, class:^(steam)$, title:^(Friends List|Steam Settings)$
windowrulev2 = float, class:^(net\.davidotek\.pupgui2)$
