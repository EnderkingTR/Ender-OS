# Ender-OS Window & Gaming Rules (Hyprland 0.54+ windowrule v3 syntax)
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = float-system-utilities
    match:class = ^(pavucontrol|org\.pulseaudio\.pavucontrol|blueman-manager|nm-connection-editor|net\.davidotek\.pupgui2)$
    float = yes
}

windowrule {
    name = picture-in-picture
    match:title = ^(Picture-in-Picture)$
    float = yes
    pin = yes
}

windowrule {
    name = gaming-immediate-tearing
    match:class = ^(gamescope|steam_app_.*|.*\.exe)$
    immediate = yes
}

windowrule {
    name = gamescope-fullscreen
    match:class = ^(gamescope)$
    fullscreen = yes
}

windowrule {
    name = fullscreen-idle-inhibit
    match:class = .*
    idle_inhibit = fullscreen
}

windowrule {
    name = steam-aux-dialogs
    match:class = ^(steam)$
    match:title = ^(Friends List|Steam Settings)$
    float = yes
}
