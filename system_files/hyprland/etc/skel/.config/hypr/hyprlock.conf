general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    color = rgba(13, 13, 20, 1.0)
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(9b5de5)
    inner_color = rgb(161622)
    font_color = rgb(eceff4)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(eceff4)
    font_size = 64
    font_family = JetBrains Mono
    position = 0, 100
    halign = center
    valign = center
}
