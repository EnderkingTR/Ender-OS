# Ender-OS Modular Hyprland Configuration
source = ~/.config/hypr/monitors.conf
source = ~/.config/ender-os/current-theme/hyprland.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_VIDEODRIVER,wayland,x11
env = GDK_BACKEND,wayland,x11,*
env = MOZ_ENABLE_WAYLAND,1

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    resize_on_border = true
    allow_tearing = true
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.96

    blur {
        enabled = true
        size = 5
        passes = 2
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
    }
}

animations {
    enabled = true
    bezier = enderEase, 0.22, 1, 0.36, 1
    animation = windows, 1, 4, enderEase, popin 88%
    animation = windowsOut, 1, 3, enderEase, popin 88%
    animation = border, 1, 5, default
    animation = fade, 1, 4, enderEase
    animation = workspaces, 1, 4, enderEase, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

input {
    kb_layout = us,tr
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
    touchpad {
        natural_scroll = true
    }
}

misc {
    vrr = 2
    vfr = true
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

render {
    direct_scanout = 1
}

cursor {
    no_hardware_cursors = 2
}
