label: "Ender-OS-Live"
grub2:
  timeout: 5
  entries:
    - name: "Start Ender-OS Live & Installer"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=Ender-OS-Live enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Start Ender-OS Live & Installer (Basic Graphics Mode)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=Ender-OS-Live enforcing=0 rd.live.image nomodeset"
      initrd: "/images/pxeboot/initrd.img"
